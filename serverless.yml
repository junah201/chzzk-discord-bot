    # S3 Bucket for React App Hosting
    ReactAppS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: chzzk.junah.dev
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    ProdAppOAC:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: chzzk.junah.dev-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4
          Description: OAC for Next.js App

    ProdAppBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ReactAppS3Bucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub arn:aws:s3:::${ReactAppS3Bucket}/*
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ReactAppCloudFrontDistribution}

    ReactAppCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          HttpVersion: http2and3
          DefaultRootObject: index.html
          PriceClass: PriceClass_All

          CustomErrorResponses:
            # 없는 경로는 리라이트 후 S3가 403을 돌려주므로 403도 404 페이지로 보낸다
            - ErrorCode: 403
              ResponseCode: 404
              ResponsePagePath: /404.html
            - ErrorCode: 404
              ResponseCode: 404
              ResponsePagePath: /404.html

          Origins:
            - Id: DevAppOrigin
              DomainName: !GetAtt ReactAppS3Bucket.RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""
              OriginAccessControlId: !GetAtt ProdAppOAC.Id

          DefaultCacheBehavior:
            TargetOriginId: DevAppOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN

          WebACLId: arn:aws:wafv2:us-east-1:897699718511:global/webacl/CreatedByCloudFront-b31a1830/c075eed8-3d5d-46c7-b38c-55c99c498408
          Aliases:
            - chzzk.junah.dev
            - junah.dev
          ViewerCertificate:
            AcmCertificateArn: arn:aws:acm:us-east-1:897699718511:certificate/0abbf59d-1025-48cf-9e41-c16f39b17c42
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021

    RewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: chzzk-junah-dev-rewrite
        AutoPublish: true
        FunctionConfig:
          Comment: Rewrite directory index to index.html
          Runtime: cloudfront-js-1.0
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var uri = request.uri;

            if (uri.endsWith('/')) {
              request.uri += 'index.html';
            }
            else if (!uri.includes('.')) {
              request.uri += '/index.html';
            }

            return request;
          }

    GitHubOIDCProvider:
      Type: AWS::IAM::OIDCProvider
      Properties:
        Url: "https://token.actions.githubusercontent.com"
        ClientIdList:
          - "sts.amazonaws.com"
        ThumbprintList:
          - "6938fd4d98bab03faadb97b34396831e3780aea1"
          - "1c58a3a8518e8759bf075b76b750d4f2df264fcd"

    GithubActionsRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: GithubActionsRole
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: sts:AssumeRoleWithWebIdentity
              Principal:
                Federated:
                  - Fn::GetAtt: [GitHubOIDCProvider, Arn]
              Condition:
                StringEquals:
                  token.actions.githubusercontent.com:sub: "repo:junah201/chzzk-discord-bot:environment:Production"
        Policies:
          - PolicyName: GithubActionsPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                    - s3:ListBucket
                  Resource:
                    - Fn::Sub: "arn:aws:s3:::${ReactAppS3Bucket}"
                    - Fn::Sub: "arn:aws:s3:::${ReactAppS3Bucket}/*"
                - Effect: Allow
                  Action:
                    - cloudfront:CreateInvalidation
                  Resource:
                    - Fn::Sub: "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ReactAppCloudFrontDistribution}"
