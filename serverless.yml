# "org" ensures this Service is used with the correct Serverless Framework License Key.
org: junah
service: chzzk

provider:
  name: aws
  runtime: python3.12
  region: ap-northeast-2
  profile: chzzk
  logRetentionInDays: 14
  architecture: x86_64
  memorySize: 256
  timeout: 10
  versionFunctions: false
  stage: prodV2
  tags:
    version: v2
  environment:
    PYTHONPATH: "/var/task/lambdas:/opt/python"
    DISCORD_PUBLIC_KEY: ${env:DISCORD_PUBLIC_KEY}
    DISCORD_TOKEN: ${env:DISCORD_TOKEN}
    DISCORD_CLIENT_ID: ${env:DISCORD_CLIENT_ID}
    DISCORD_CLIENT_SECRET: ${env:DISCORD_CLIENT_SECRET}
    DISCORD_NAVER_SESSION_RENEW_EXPIRED_CHANNEL_ID: "1532709226043146310"
    DISCORD_GET_FOLLOWING_ERROR_CHANNEL_ID: "1532712016882438234"
    DISCORD_CHZZK_FOLLOW_ERROR_CHANNEL_ID: "1533371278461898783"
    DISCORD_KOREANBOTS_UPDATE_STATS_ERROR_CHANNEL_ID: "1549682811567607868"
    DISCORD_CLEANUP_ORPHAN_CHANNEL_ID: "1564569823080489012"
    DISCORD_WEEKLY_REPORT_CHANNEL_ID: "1564687500704874577"
    DISCORD_WEEKLY_REPORT_ERROR_CHANNEL_ID: "1564687374619901952"
    DISCORD_SUBSCRIPTION_EXPIRY_REPORT_CHANNEL_ID: "1567942386867376148"
    DISCORD_SUBSCRIPTION_EXPIRY_ERROR_CHANNEL_ID: "1567942306412232734"
    ADMIN_DISCORD_PUBLIC_KEY: ${env:ADMIN_DISCORD_PUBLIC_KEY}
    ADMIN_DISCORD_USER_ID: ${env:ADMIN_DISCORD_USER_ID}
    ADMIN_DISCORD_TOKEN: ${env:ADMIN_DISCORD_TOKEN}
    KOREANBOTS_TOKEN: ${env:KOREANBOTS_TOKEN}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:BatchGetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:TransactWriteItems
            - dynamodb:Scan
          Resource:
            - "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/chzzk-bot-db"
            - "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/chzzk-bot-db/index/*"
        - Effect: Allow
          Action:
            - logs:StartQuery
          Resource:
            - "arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/create_notification:*"
            - "arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/delete_notification:*"
            - "arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/update_notification:*"
            - "arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/live_check_v2:*"
            - "arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/sync_koreanbots_stats:*"
        - Effect: Allow
          Action:
            - logs:GetQueryResults
            - logs:StopQuery
          Resource: "*"

custom:
  layers:
    pynacl: "arn:aws:lambda:ap-northeast-2:897699718511:layer:pynacl:1"

  pythonRequirements:
    useUv: true
    installer: uv
    slim: true

functions:
  discord_interactions:
    handler: lambdas/bot/discord_interactions.handler
    name: discord_interactions
    description: 디스코드 봇의 슬래시 명령어와 인터랙션을 처리합니다.
    tags:
      type: bot
    events:
      - http:
          path: event
          method: post
    layers:
      - ${self:custom.layers.pynacl}

  admin_discord_interactions:
    handler: lambdas/bot/admin_discord_interactions.handler
    name: admin_discord_interactions
    description: 관리자 봇 명령어로 슬롯 구매와 구독을 처리합니다.
    tags:
      type: bot
    events:
      - http:
          path: admin/event
          method: post
    layers:
      - ${self:custom.layers.pynacl}

  exchange_oauth2_token:
    handler: lambdas/api/auth/exchange_oauth2_token.handler
    name: exchange_oauth2_token
    description: 디스코드 OAuth2 인가 코드를 액세스 토큰으로 교환합니다.
    tags:
      type: api
    events:
      - http:
          path: oauth/token
          method: post
          cors: true

  get_me:
    handler: lambdas/api/auth/get_me.handler
    name: get_me
    description: 로그인한 사용자의 디스코드 프로필을 가져옵니다.
    tags:
      type: api
    events:
      - http:
          path: discord/me
          method: get
          cors: true

  list_guilds:
    handler: lambdas/api/guilds/list_guilds.handler
    name: list_guilds
    description: 사용자가 관리자인 디스코드 서버 목록을 가져옵니다.
    tags:
      type: api
    events:
      - http:
          path: discord/guilds
          method: get
          cors: true

  get_guild:
    handler: lambdas/api/guilds/get_guild.handler
    name: get_guild
    description: 디스코드 서버 정보를 가져옵니다. 봇이 없는 서버면 오류를 반환합니다.
    tags:
      type: api
    events:
      - http:
          path: discord/{guild_id}
          method: get
          cors: true

  sync_guild_slots:
    handler: lambdas/api/guilds/sync_guild_slots.handler
    name: sync_guild_slots
    description: 실제 알림 수를 다시 세서 디스코드 서버의 사용 중인 슬롯 수를 맞춥니다.
    tags:
      type: api
    events:
      - http:
          path: discord/{guild_id}/slots/sync
          method: post
          cors: true

  list_guild_channels:
    handler: lambdas/api/guilds/list_guild_channels.handler
    name: list_guild_channels
    description: 디스코드 서버의 채널 목록을 가져옵니다. 봇이 없는 서버면 오류를 반환합니다.
    tags:
      type: api
    events:
      - http:
          path: discord/{guild_id}/channels
          method: get
          cors: true

  create_notification:
    handler: lambdas/api/notifications/create_notification.handler
    name: create_notification
    description: 치지직 채널 알림을 등록하고 네이버 계정이 그 채널을 팔로우하게 합니다.
    tags:
      type: api
    events:
      - http:
          path: notifications
          method: post
          cors: true

  list_guild_notifications:
    handler: lambdas/api/notifications/list_guild_notifications.handler
    name: list_guild_notifications
    description: 디스코드 서버에 등록된 알림 목록을 가져옵니다.
    tags:
      type: api
    events:
      - http:
          path: notifications/{guild_id}
          method: get
          cors: true

  delete_notification:
    handler: lambdas/api/notifications/delete_notification.handler
    name: delete_notification
    description: 알림을 삭제하고 디스코드 서버의 사용 중인 슬롯 수를 줄입니다.
    tags:
      type: api
    events:
      - http:
          path: notifications
          method: delete
          cors: true

  send_test_notification:
    handler: lambdas/api/notifications/send_test_notification.handler
    name: send_test_notification
    description: 등록된 알림 설정 그대로 테스트 메시지를 보냅니다.
    tags:
      type: api
    events:
      - http:
          path: notifications/test
          method: post
          cors: true

  update_notification:
    handler: lambdas/api/notifications/update_notification.handler
    name: update_notification
    description: 알림 설정(메시지, 표시 옵션 등)을 수정합니다.
    tags:
      type: api
    events:
      - http:
          path: notifications
          method: put
          cors: true

  # TODO: debug 로그로 실행 시간 분석이 끝나면(2026-11-14쯤) check_live_streams로 이름을 바꾸고 _v2를 제거
  live_check:
    handler: lambdas/cron/live_check.handler
    name: live_check_v2
    environment:
      LIVE_STREAMS_SOURCE_URL: ${env:LIVE_STREAMS_SOURCE_URL}
    description: 주기적으로 방송을 시작한 채널을 찾아 알림을 보냅니다.
    tags:
      type: cron
    timeout: 285
    memorySize: 160
    maximumRetryAttempts: 0
    events:
      - schedule:
          method: scheduler
          name: live_check_for_0
          rate: cron(0/5 * ? * * *)
          input:
            index: 0
      - schedule:
          method: scheduler
          name: live_check_for_1
          rate: cron(1/5 * ? * * *)
          input:
            index: 1
      - schedule:
          method: scheduler
          name: live_check_for_2
          rate: cron(2/5 * ? * * *)
          input:
            index: 2
      - schedule:
          method: scheduler
          name: live_check_for_3
          rate: cron(3/5 * ? * * *)
          input:
            index: 3
      - schedule:
          method: scheduler
          name: live_check_for_4
          rate: cron(4/5 * ? * * *)
          input:
            index: 4
      - schedule:
          method: scheduler
          name: live_check_for_5
          rate: cron(0/5 * ? * * *)
          input:
            index: 5
      - schedule:
          method: scheduler
          name: live_check_for_6
          rate: cron(1/5 * ? * * *)
          input:
            index: 6

  renew_naver_sessions:
    handler: lambdas/cron/renew_naver_sessions.handler
    name: renew_naver_sessions
    description: 주기적으로 네이버 계정의 세션 쿠키를 갱신합니다.
    tags:
      type: cron
    timeout: 60
    maximumRetryAttempts: 0
    events:
      - schedule:
          method: scheduler
          rate: rate(12 hours)

  sync_koreanbots_stats:
    handler: lambdas/cron/sync_koreanbots_stats.handler
    name: sync_koreanbots_stats
    description: 주기적으로 봇의 서버 수를 한국 디스코드 리스트(KoreanBots)에 올립니다.
    tags:
      type: cron
    maximumRetryAttempts: 0
    events:
      - schedule:
          method: scheduler
          rate: rate(12 hours)

  cleanup_orphan_chzzk_channels:
    handler: lambdas/cron/cleanup_orphan_chzzk_channels.handler
    name: cleanup_orphan_chzzk_channels
    description: 주기적으로 알림이 없는 치지직 채널의 팔로우를 해제하고 삭제한 뒤 보고서를 보냅니다.
    tags:
      type: cron
    timeout: 600
    maximumRetryAttempts: 0
    events:
      - schedule:
          method: scheduler
          rate: cron(30 5 1 * ? *) # 매월 1일 05:30 KST
          timezone: Asia/Seoul

  send_weekly_report:
    handler: lambdas/cron/send_weekly_report.handler
    name: send_weekly_report
    description: 주기적으로 주간 운영 리포트를 디스코드 채널에 보냅니다.
    tags:
      type: cron
    timeout: 600
    maximumRetryAttempts: 0
    events:
      - schedule:
          method: scheduler
          rate: cron(0 1 ? * MON *) # 매주 월요일 01:00 KST
          timezone: Asia/Seoul

  expire_subscriptions:
    handler: lambdas/cron/expire_subscriptions.handler
    name: expire_subscriptions
    description: 주기적으로 만료된 구독을 종료하고 디스코드 서버의 슬롯 한도를 되돌립니다.
    tags:
      type: cron
    timeout: 300
    maximumRetryAttempts: 0
    events:
      - schedule:
          method: scheduler
          rate: cron(5 0 * * ? *) # 매일 00:05 KST
          timezone: Asia/Seoul

  unfollow_chzzk_channel:
    handler: lambdas/admin/unfollow_chzzk_channel.handler
    name: unfollow_chzzk_channel
    description: 치지직 채널 팔로우를 수동으로 해제합니다. 관리자가 직접 호출합니다.
    tags:
      type: admin

package:
  patterns:
    - "!**"
    - "lambdas/**"
    - "!lambdas/tests/**"
    - "!**/__pycache__/**"

resources:
  Resources:
    ApiGatewayRestApi:
      Type: AWS::ApiGateway::RestApi
      Properties:
        Name: Chzzk-API
        Description: API for chzzk.junah.dev

    ApiGatewayCustomDomain:
      Type: AWS::ApiGateway::DomainName
      Properties:
        DomainName: api.chzzk.junah.dev
        RegionalCertificateArn: arn:aws:acm:ap-northeast-2:897699718511:certificate/cc97a8de-224c-4914-aa4f-6a1aa40b3831
        EndpointConfiguration:
          Types:
            - REGIONAL
        SecurityPolicy: TLS_1_2

    ApiGatewayBasePathMapping:
      Type: AWS::ApiGateway::BasePathMapping
      Properties:
        DomainName:
          Ref: ApiGatewayCustomDomain
        RestApiId:
          Ref: ApiGatewayRestApi
        Stage: prodV2

    ApiGatewayInviteResource:
      Type: AWS::ApiGateway::Resource
      Properties:
        ParentId:
          Fn::GetAtt:
            - ApiGatewayRestApi
            - RootResourceId
        PathPart: invite
        RestApiId:
          Ref: ApiGatewayRestApi

    ApiGatewayInviteMethod:
      Type: AWS::ApiGateway::Method
      Properties:
        AuthorizationType: NONE
        HttpMethod: GET
        Integration:
          Type: HTTP_PROXY
          IntegrationHttpMethod: GET
          Uri: "https://discord.com/api/oauth2/authorize?client_id=1191657232480350238&permissions=137439398912&scope=bot"
        ResourceId:
          Ref: ApiGatewayInviteResource
        RestApiId:
          Ref: ApiGatewayRestApi

    ApiGatewaySupportServerResource:
      Type: AWS::ApiGateway::Resource
      Properties:
        ParentId:
          Fn::GetAtt:
            - ApiGatewayRestApi
            - RootResourceId
        PathPart: support-server
        RestApiId:
          Ref: ApiGatewayRestApi

    ApiGatewaySupportServerMethod:
      Type: AWS::ApiGateway::Method
      Properties:
        AuthorizationType: NONE
        HttpMethod: GET
        Integration:
          Type: HTTP_PROXY
          IntegrationHttpMethod: GET
          Uri: "https://discord.gg/jUuCxtyySK"
        ResourceId:
          Ref: ApiGatewaySupportServerResource
        RestApiId:
          Ref: ApiGatewayRestApi

    # TODO : Import DynamoDB Table from original resources
