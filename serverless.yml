# "org" ensures this Service is used with the correct Serverless Framework License Key.
org: junah
service: chzzk
useDotenv: true

provider:
  name: aws
  runtime: python3.12
  region: ap-northeast-2
  profile: chzzk
  logRetentionInDays: 14
  architecture: x86_64
  memorySize: 128
  timeout: 10
  versionFunctions: false
  stage: prodV2
  environment:
    PYTHONPATH: "/var/task/lambdas"
    DISCORD_PUBLIC_KEY: ${env:DISCORD_PUBLIC_KEY}
    DISCORD_TOKEN: ${env:DISCORD_TOKEN}
    DISCORD_CLIENT_ID: ${env:DISCORD_CLIENT_ID}
    DISCORD_CLIENT_SECRET: ${env:DISCORD_CLIENT_SECRET}
    DISCORD_NAVER_SESSION_RENEW_EXPIRED_CHANNEL_ID: "1532709226043146310"
    DISCORD_GET_FOLLOWING_ERROR_CHANNEL_ID: "1532712016882438234"
    DISCORD_CHZZK_FOLLOW_ERROR_CHANNEL_ID: "1533371278461898783"
    DISCORD_KOREANBOTS_UPDATE_STATS_ERROR_CHANNEL_ID: "1549682811567607868"
    DISCORD_CLEANUP_ORPHAN_CHANNEL_ID: "1564569823080489012"
    DISCORD_WEEKLY_REPORT_CHANNEL_ID: "1564687500704874577"
    DISCORD_WEEKLY_REPORT_ERROR_CHANNEL_ID: "1564687374619901952"
    ADMIN_DISCORD_PUBLIC_KEY: ${env:ADMIN_DISCORD_PUBLIC_KEY}
    ADMIN_DISCORD_USER_ID: ${env:ADMIN_DISCORD_USER_ID}
    ADMIN_DISCORD_TOKEN: ${env:ADMIN_DISCORD_TOKEN}
    KOREANBOTS_TOKEN: ${env:KOREANBOTS_TOKEN}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:BatchGetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:TransactWriteItems
        - dynamodb:Scan
      Resource:
        - "arn:aws:dynamodb:${aws:region}:${AWS::AccountId}:table/chzzk-bot-db"
        - "arn:aws:dynamodb:${aws:region}:${AWS::AccountId}:table/chzzk-bot-db/index/*"
    - Effect: Allow
      Action:
        - logs:StartQuery
      Resource:
        - "arn:aws:logs:${aws:region}:${AWS::AccountId}:log-group:/aws/lambda/post_notification_v2:*"
        - "arn:aws:logs:${aws:region}:${AWS::AccountId}:log-group:/aws/lambda/delete_notification_v2:*"
        - "arn:aws:logs:${aws:region}:${AWS::AccountId}:log-group:/aws/lambda/update_notification_v2:*"
        - "arn:aws:logs:${aws:region}:${AWS::AccountId}:log-group:/aws/lambda/live_check_v2:*"
        - "arn:aws:logs:${aws:region}:${AWS::AccountId}:log-group:/aws/lambda/sync_koreanbots_stats_v2:*"
    - Effect: Allow
      Action:
        - logs:GetQueryResults
        - logs:StopQuery
      Resource: "*"

functions:
  event_handler:
    handler: lambdas/bot/event_handler.handler
    name: event_handler_v2
    description: Handle event from discord (slash command, interaction)
    events:
      - http:
          path: event
          method: post
          cors: true

  admin_event_handler:
    handler: lambdas/bot/admin_event_handler.handler
    name: admin_event_handler
    description: Handle admin discord bot interactions and subscriptions
    events:
      - http:
          path: admin/event
          method: post
          cors: true

  discord_oauth2_redirect:
    handler: lambdas/api/auth/discord_oauth2_redirect.handler
    name: discord_oauth2_redirect_v2
    description: Handle OAuth2 redirect from discord
    events:
      - http:
          path: oauth/token
          method: post
          cors: true

  discord_me:
    handler: lambdas/api/auth/discord_me.handler
    name: discord_me_v2
    description: Get user information from discord
    events:
      - http:
          path: discord/me
          method: get
          cors: true

  discord_guilds:
    handler: lambdas/api/guilds/discord_guilds.handler
    name: discord_guilds_v2
    description: Get guilds information from discord
    events:
      - http:
          path: discord/guilds
          method: get
          cors: true

  discord_guild_by_id:
    handler: lambdas/api/guilds/discord_guild_by_id.handler
    name: discord_guild_by_id_v2
    description: Get guild information by ID from discord
    events:
      - http:
          path: discord/{guild_id}
          method: get
          cors: true

  get_guild_channels:
    handler: lambdas/api/guilds/get_guild_channels.handler
    name: get_guild_channels_v2
    description: 특정 ID의 디스코드 서버의 채널 목록을 가져옵니다. 만약 해당 서버가 존재하지 않거나 접근할 수 없는 경우 404를 반환합니다.
    events:
      - http:
          path: discord/{guild_id}/channels
          method: get
          cors: true

  post_notification:
    handler: lambdas/api/notifications/post_notification.handler
    name: post_notification_v2
    description: 치지직 알림을 추가합니다.
    events:
      - http:
          path: notifications
          method: post
          cors: true

  get_notification_by_guild_id:
    handler: lambdas/api/notifications/get_notification_by_guild_id.handler
    name: get_notification_by_guild_id_v2
    description: 특정 ID의 디스코드 서버의 알림 목록을 가져옵니다. 데이터가 없을 경우 빈 리스트를 반환합니다.
    events:
      - http:
          path: notifications/{guild_id}
          method: get
          cors: true

  delete_notification:
    handler: lambdas/api/notifications/delete_notification.handler
    name: delete_notification_v2
    description: 알림을 삭제합니다. 만약 해당 알림이 없으면 404를 반환합니다.
    events:
      - http:
          path: notifications
          method: delete
          cors: true

  send_test_notification:
    handler: lambdas/api/notifications/send_test_notification.handler
    name: send_test_notification_v2
    description: 테스트 알림을 보냅니다.
    events:
      - http:
          path: notifications/test
          method: post
          cors: true

  update_notification:
    handler: lambdas/api/notifications/update_notification.handler
    name: update_notification_v2
    description: 알림을 수정합니다. 만약 해당 알림이 없으면 404를 반환합니다.
    events:
      - http:
          path: notifications
          method: put
          cors: true

  live_check:
    handler: lambdas/cron/live_check.handler
    name: live_check_v2
    description: live check V2
    timeout: 270

  naver_session_renew:
    handler: lambdas/cron/naver_session_renew.handler
    name: naver_session_renew_v2
    description: 네이버 계정 세션 갱신
    timeout: 60
    events:
      - schedule: rate(12 hours)

  sync_koreanbots_stats:
    handler: lambdas/cron/sync_koreanbots_stats.handler
    name: sync_koreanbots_stats_v2
    description: Sync KoreanBots stats
    events:
      - schedule: rate(12 hours)

  cleanup_orphan_chzzk_channels:
    handler: lambdas/cron/cleanup_orphan_chzzk_channels.handler
    name: cleanup_orphan_chzzk_channels_v2
    description: Cleanup orphan chzzk channels and send report to discord channel
    timeout: 600
    memorySize: 256
    events:
      - schedule: cron(30 20 L * ? *) # 매월 1일 5시 30분 (KST 기준) -> UTC 기준 11:30 PM (전날)

  weekly_report:
    handler: lambdas/cron/weekly_report.handler
    name: weekly_report_v2
    description: Send weekly report to discord channel
    timeout: 600
    events:
      - schedule:
          rate: cron(0 16 ? * SUN *) # 매주 월요일 01:00 KST = 일요일 16:00 UTC
          enabled: true

  chzzk_unfollow:
    handler: lambdas/admin/chzzk_unfollow.handler
    name: chzzk_unfollow_v2
    description: 치지직 채널 팔로우 해제 (관리자 전용)

package:
  include:
    - "lambdas/**"
    - "shared/**"
    - "requirements.txt"
  exclude:
    - "node_modules/**"
    - ".venv/**"
    - ".git/**"
    - ".github/**"
    - "frontend/**"
    - "scripts/**"
    - "serverless.yml"
    - ".serverless/**"
    - ".pnpm-store/**"
    - ".devcontainer/**"
    - ".ruff_cache/**"
    - ".claude/**"

