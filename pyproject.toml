[project]
name = "chzzk-discord-bot"
version = "2.0.0"
description = ""
authors = [
    { name = "junah201", email = "junah.dev@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "user-agent>=0.1.14",
]

[dependency-groups]
dev = [
    "ruff>=0.6.7",
    "pynacl>=1.6.2",
    "boto3>=1.43.119",
    "botocore[crt]>=1.43.119",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "pytest-cov>=7.1.0",
    "tzdata>=2026.6",
    "responses>=0.26.3",
    "moto[dynamodb]>=5.2.5",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?)|context)$"

[tool.pytest.ini_options]
pythonpath = ["lambdas"]
testpaths = ["lambdas/tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
omit = ["lambdas/tests/*"]
